name: CarLink

options:
  bundleIdPrefix: com.carlink
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: "19"
    MARKETING_VERSION: "0.6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.carlink.CarLink
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO

configs:
  Debug: debug
  Release: release

targets:
  CarLink:
    type: application
    platform: iOS
    sources:
      - path: CarLink
    settings:
      base:
        PRODUCT_NAME: CarLink
        INFOPLIST_FILE: CarLink/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CarLink/CarLink.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        VERSIONING_SYSTEM: apple-generic
    dependencies:
      - sdk: WebKit.framework
      - sdk: CarPlay.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: MediaPlayer.framework
